    <!-- ============================================================
         SECCIÓN: TEST DE EVALUACIÓN
         Visible por defecto al cargar esta página (sin clase 'oculto').
         El id se mantiene como 'test' para que estadistica.js
         siga funcionando sin cambios (generarTest, calificarTest, etc.)
         ============================================================ -->
    <section id="test">
        <h2>Test de Evaluación</h2>

        <p>
            Responde las siguientes preguntas sobre estadística descriptiva.
            Al finalizar, presiona el botón para conocer tu calificación.
        </p>

        <!-- Contenedor donde generarTest() inyecta las preguntas dinámicamente -->
        <div id="contenedor-test"></div>

        <button onclick="calificarTest()" class="btn-interactivo">
            Calificar Test
        </button>

        <button onclick="reiniciarTest()" class="btn-interactivo">
            Reiniciar Test
        </button>

        <div id="resultado-test"></div>
    </section>
